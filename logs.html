<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLIKSY Activity Logs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050617 0%, #12061f 45%, #1b0c2d 100%);
            min-height: 100vh;
            color: #FFFFFF;
            padding: 40px 24px 80px;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 24px 100px;
        }

        .page-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 8px;
        }

        .page-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 40px;
        }

        .status-message {
            min-height: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
        }

        .status-message.error {
            color: #FF6B6B;
        }

        .filters {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .filters input {
            flex: 1;
            min-width: 220px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #FFFFFF;
            font-size: 15px;
        }

        .filters input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.08em;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .logs-table {
            margin-top: 32px;
            background: rgba(14, 8, 33, 0.85);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(255, 255, 255, 0.05);
        }

        th {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 12px;
            padding: 18px 24px;
            text-align: left;
            color: rgba(255, 255, 255, 0.7);
        }

        tbody tr {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        td {
            padding: 18px 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        .col-date {
            width: 220px;
            font-weight: 600;
        }

        .col-action {
            width: 180px;
            color: #FFB86C;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .col-email,
        .col-username {
            word-break: break-word;
        }

        .col-other {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

    </style>
</head>

<body>
    <main>
        <h1 class="page-title">Kliksy Activity Ledger</h1>
        <p class="page-subtitle">Real-time audit trail for every Kliksy action</p>

        <div class="filters">
            <input type="search" id="searchInput" placeholder="Filter by email, username, or action">
            <button id="refreshBtn" class="refresh-btn" type="button">
                <i class="fas fa-sync-alt"></i>
                Refresh
            </button>
        </div>

        <div id="logsStatus" class="status-message" role="status" aria-live="polite"></div>

        <div class="logs-table" aria-live="polite">
            <table>
                <thead>
                    <tr>
                        <th>Date / Time</th>
                        <th>Action</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Other Data</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody"></tbody>
            </table>
        </div>

    </main>

    <script>
        const LOGS_ENDPOINT = 'https://hoev7s4i82.execute-api.us-east-1.amazonaws.com/logs-all';

        const logsTableBody = document.getElementById('logsTableBody');
        const logsStatus = document.getElementById('logsStatus');
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');

        let isFetching = false;
        let allLogs = [];

        const setStatus = (message = '', type = '') => {
            logsStatus.textContent = message;
            logsStatus.classList.remove('error');
            if (type === 'error') {
                logsStatus.classList.add('error');
            }
        };

        const formatPhilippineDate = (input) => {
            if (!input) return 'Unknown time';
            const normalized = input.endsWith('Z') || input.includes('+') ? input : `${input}Z`;
            const date = new Date(normalized);
            if (Number.isNaN(date.getTime())) return 'Unknown time';
            return new Intl.DateTimeFormat('en-PH', {
                timeZone: 'Asia/Manila',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);
        };

        const buildMetadataText = (metadata = {}, excludeKeys = []) => {
            const excluded = new Set((excludeKeys || []).map((key) => String(key).toLowerCase()));
            const entries = Object.entries(metadata)
                .filter(([key, value]) => Boolean(value) && !excluded.has(String(key).toLowerCase()))
                .map(([key, value]) => `${key}: ${value}`);
            return entries.length ? entries.join(' • ') : 'No extra metadata';
        };

        const createLogRow = (log) => {
            const row = document.createElement('tr');

            const dateCell = document.createElement('td');
            dateCell.className = 'col-date';
            dateCell.textContent = formatPhilippineDate(log.eventTimestamp);
            row.appendChild(dateCell);

            const actionCell = document.createElement('td');
            actionCell.className = 'col-action';
            actionCell.textContent = log.action || 'ACTION';
            row.appendChild(actionCell);

            const emailCell = document.createElement('td');
            emailCell.className = 'col-email';
            emailCell.textContent = log.metadata?.email || '—';
            row.appendChild(emailCell);

            const usernameCell = document.createElement('td');
            usernameCell.className = 'col-username';
            usernameCell.textContent = log.metadata?.username || 'Unknown user';
            row.appendChild(usernameCell);

            const otherCell = document.createElement('td');
            otherCell.className = 'col-other';
            otherCell.textContent = buildMetadataText(log.metadata || {}, ['email', 'username']);
            row.appendChild(otherCell);

            return row;
        };

        const renderLogs = (logs) => {
            logsTableBody.innerHTML = '';
            if (!logs.length) {
                setStatus('No logs yet.');
                return;
            }
            setStatus('');
            const fragment = document.createDocumentFragment();
            logs.forEach(log => fragment.appendChild(createLogRow(log)));
            logsTableBody.appendChild(fragment);
        };

        const applyFilter = () => {
            const term = searchInput.value.trim().toLowerCase();
            if (!term) {
                renderLogs(allLogs);
                return;
            }
            const filtered = allLogs.filter(log => {
                const haystack = [
                    log.metadata?.email,
                    log.metadata?.username,
                    buildMetadataText(log.metadata || {}, []),
                    log.action,
                ].join(' ').toLowerCase();
                return haystack.includes(term);
            });
            renderLogs(filtered);
        };

        searchInput.addEventListener('input', () => {
            applyFilter();
        });

        refreshBtn.addEventListener('click', () => {
            fetchLogs();
        });

        const fetchLogs = async () => {
            if (isFetching) return;
            isFetching = true;
            setStatus('Loading logs…');
            try {
                const response = await fetch(LOGS_ENDPOINT);
                if (!response.ok) {
                    throw new Error('Unable to load logs right now.');
                }
                const payload = await response.json().catch(() => []);
                const list = Array.isArray(payload) ? payload : (payload?.items || []);

                allLogs = list;
                renderLogs(allLogs);
                applyFilter();
            } catch (error) {
                console.error('Logs error:', error);
                setStatus(error.message || 'Something went wrong.', 'error');
            } finally {
                isFetching = false;
            }
        };

        fetchLogs();
    </script>
</body>

</html>
